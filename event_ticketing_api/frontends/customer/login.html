<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Customer Sign In &amp; Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #064e3b;
        }
        .login-wrapper {
            width: 100%;
            max-width: 460px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            padding: 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-icon {
            font-size: 40px;
            display: inline-block;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .login-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: #dcfce7;
            color: #15803d;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }
        
        /* Auth Mode Toggle Tabs */
        .auth-toggle {
            display: flex;
            background: #f0fdf4;
            border: 1.5px solid #bbf7d0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }
        .auth-toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .auth-toggle-btn.active {
            background: #059669;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-with-icon {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #94a3b8;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: #f0fdf4;
        }
        .form-control:focus {
            outline: none;
            border-color: #059669;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .btn-submit:hover:not(:disabled) {
            background: #047857;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -4px rgba(5, 150, 105, 0.35);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.4;
        }
        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .alert-success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .alert-info {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .demo-credentials-box {
            margin-top: 20px;
            padding: 16px;
            background: #f0fdf4;
            border: 1px dashed #86efac;
            border-radius: 12px;
            text-align: left;
        }
        .demo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .demo-header span {
            font-size: 12px;
            font-weight: 700;
            color: #166534;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .demo-btn {
            background: #ffffff;
            border: 1px solid #bbf7d0;
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .demo-btn:hover {
            border-color: #059669;
            background: #dcfce7;
        }
        .demo-btn strong {
            display: block;
            font-size: 13px;
            color: #064e3b;
        }
        .demo-btn small {
            font-size: 11px;
            color: #64748b;
        }
        .demo-btn .badge-click {
            font-size: 11px;
            color: #059669;
            font-weight: 600;
        }
        .footer-nav {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .footer-nav a {
            color: #a7f3d0;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-nav a:hover {
            color: #ffffff;
        }
        .footer-nav .divider {
            color: #047857;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="login-icon">🎟️</span><br>
                <span class="login-badge">Customer Portal</span>
                <h1 class="login-title" id="page-heading">Customer Sign In</h1>
                <p class="login-subtitle" id="page-subheading">Sign in to book event tickets, manage reservations, and download your digital QR passes.</p>
            </div>

            <!-- Auth Mode Toggle Tabs -->
            <div class="auth-toggle">
                <button type="button" class="auth-toggle-btn active" id="btn-toggle-login" onclick="switchAuthMode('login')">
                    <span>🔑</span> Sign In
                </button>
                <button type="button" class="auth-toggle-btn" id="btn-toggle-register" onclick="switchAuthMode('register')">
                    <span>✨</span> Sign Up (New)
                </button>
            </div>

            <!-- Existing Session Banner -->
            <div id="session-banner" class="alert-box alert-info">
                <div>You are signed in as <strong id="session-name">Customer</strong>.</div>
                <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <a href="index.html" class="btn btn-primary btn-sm" style="flex:1; text-align:center; background:#059669;">Browse Events ➔</a>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="clearExistingSession()">Switch User</button>
                </div>
            </div>

            <!-- Alerts -->
            <div id="error-alert" class="alert-box alert-danger"></div>
            <div id="success-alert" class="alert-box alert-success"></div>

            <!-- FORM 1: Sign In Form -->
            <form id="customer-login-form" onsubmit="handleCustomerLogin(event)">
                <div class="form-group">
                    <label for="customer-email">Customer Email Address</label>
                    <div class="input-with-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="customer-email" class="form-control" placeholder="aidil.customer@eventhub.my" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="customer-password">Account Password</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="customer-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btn-login-submit" class="btn-submit">
                    Sign In &amp; Continue ➔
                </button>
            </form>

            <!-- FORM 2: Sign Up (Register) Form -->
            <form id="customer-register-form" style="display:none;" onsubmit="handleCustomerRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Farhan Daniel" required minlength="3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-with-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="reg-email" class="form-control" placeholder="e.g. farhan@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number (Optional)</label>
                    <div class="input-with-icon">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+6012-3456789">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Create Password (min. 6 characters)</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" id="btn-reg-submit" class="btn-submit">
                    Create Account &amp; Sign In ➔
                </button>
            </form>

            <!-- Quick Demo Credentials Fill (Only shown on Login tab) -->
            <div id="demo-box" class="demo-credentials-box">
                <div class="demo-header">
                    <span>⚡ Quick Demo Credentials</span>
                </div>
                <button type="button" class="demo-btn" onclick="fillCustomerCredentials()">
                    <div>
                        <strong>Aidil Najmee (Customer)</strong>
                        <small>aidil.customer@eventhub.my &bull; Password123!</small>
                    </div>
                    <span class="badge-click">Fill &rarr;</span>
                </button>
            </div>
        </div>

        <div class="footer-nav">
            <a href="../../index.html">&larr; Back to Master Hub</a>
            <span class="divider">&bull;</span>
            <a href="index.html">Browse as Guest &rarr;</a>
        </div>
    </div>

    <script src="../../shared/js/api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = ApiClient.getToken();
            const user = ApiClient.getUser();

            if (token && user && user.role === 'customer') {
                document.getElementById('session-banner').style.display = 'block';
                document.getElementById('session-name').textContent = user.full_name || 'Customer';
            }
        });

        function switchAuthMode(mode) {
            hideAlerts();
            const btnLogin = document.getElementById('btn-toggle-login');
            const btnReg = document.getElementById('btn-toggle-register');
            const formLogin = document.getElementById('customer-login-form');
            const formReg = document.getElementById('customer-register-form');
            const demoBox = document.getElementById('demo-box');
            const heading = document.getElementById('page-heading');
            const subheading = document.getElementById('page-subheading');

            if (mode === 'register') {
                btnLogin.classList.remove('active');
                btnReg.classList.add('active');
                formLogin.style.display = 'none';
                formReg.style.display = 'block';
                demoBox.style.display = 'none';
                heading.textContent = 'Create Customer Account';
                subheading.textContent = 'Register a new account to book tickets, manage reservations, and download QR entry passes.';
            } else {
                btnReg.classList.remove('active');
                btnLogin.classList.add('active');
                formReg.style.display = 'none';
                formLogin.style.display = 'block';
                demoBox.style.display = 'block';
                heading.textContent = 'Customer Sign In';
                subheading.textContent = 'Sign in to book event tickets, manage reservations, and download your digital QR passes.';
            }
        }

        function clearExistingSession() {
            localStorage.removeItem('eventhub_token');
            localStorage.removeItem('eventhub_user');
            document.getElementById('session-banner').style.display = 'none';
        }

        function fillCustomerCredentials() {
            document.getElementById('customer-email').value = 'aidil.customer@eventhub.my';
            document.getElementById('customer-password').value = 'Password123!';
            hideAlerts();
        }

        function hideAlerts() {
            document.getElementById('error-alert').style.display = 'none';
            document.getElementById('success-alert').style.display = 'none';
        }

        // LOGIN HANDLER
        async function handleCustomerLogin(e) {
            e.preventDefault();
            hideAlerts();

            const email = document.getElementById('customer-email').value.trim();
            const password = document.getElementById('customer-password').value;
            const btn = document.getElementById('btn-login-submit');

            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Authenticating with REST API...";

            try {
                const res = await ApiClient.post('auth/login', { email, password });

                if (!res.data || !res.data.token) {
                    throw new Error("Invalid response envelope received from server.");
                }

                // Store credentials
                ApiClient.setSession(res.data.token, res.data.user);

                const successBox = document.getElementById('success-alert');
                successBox.textContent = `Welcome back, ${res.data.user.full_name}! Redirecting...`;
                successBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);

            } catch (err) {
                console.error("Login failed:", err);
                const msg = err.message || "Invalid email or password combination.";
                showError(msg);
                btn.disabled = false;
                btn.innerHTML = "Sign In & Continue ➔";
            }
        }

        // REGISTER HANDLER
        async function handleCustomerRegister(e) {
            e.preventDefault();
            hideAlerts();

            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-reg-submit');

            if (!fullName || !email || !password) {
                showError("Please fill in all required fields.");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters long.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Registering with REST API...";

            try {
                const payload = {
                    full_name: fullName,
                    email: email,
                    password: password,
                    role: 'customer',
                    phone_number: phone || null
                };

                const res = await ApiClient.post('auth/register', payload);

                if (!res.data || !res.data.token) {
                    throw new Error("Invalid registration response envelope from server.");
                }

                // Automatically log in the newly registered customer
                ApiClient.setSession(res.data.token, res.data.user);

                const successBox = document.getElementById('success-alert');
                successBox.textContent = `Account created successfully! Welcome, ${res.data.user.full_name}! Redirecting...`;
                successBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);

            } catch (err) {
                console.error("Registration failed:", err);
                const msg = err.message || "Registration failed. This email may already be registered.";
                showError(msg);
                btn.disabled = false;
                btn.innerHTML = "Create Account & Sign In ➔";
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('error-alert');
            errBox.textContent = msg;
            errBox.style.display = 'block';
        }
    </script>
</body>
</html>
