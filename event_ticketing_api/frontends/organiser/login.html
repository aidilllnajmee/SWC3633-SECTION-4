<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Organiser Sign In &amp; Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1e1b4b;
        }
        .login-wrapper {
            width: 100%;
            max-width: 470px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            padding: 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-icon {
            font-size: 40px;
            display: inline-block;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .login-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: #f3e8ff;
            color: #7c3aed;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 800;
            color: #1e1b4b;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }

        /* Auth Mode Toggle Tabs */
        .auth-toggle {
            display: flex;
            background: #faf5ff;
            border: 1.5px solid #d8b4fe;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }
        .auth-toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #6b21a8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .auth-toggle-btn.active {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-with-icon {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #94a3b8;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: #faf5ff;
        }
        .form-control:focus {
            outline: none;
            border-color: #7c3aed;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #7c3aed;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .btn-submit:hover:not(:disabled) {
            background: #6d28d9;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -4px rgba(124, 58, 237, 0.35);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.4;
        }
        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .alert-success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .alert-info {
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            color: #5b21b6;
        }
        .demo-credentials-box {
            margin-top: 20px;
            padding: 16px;
            background: #faf5ff;
            border: 1px dashed #d8b4fe;
            border-radius: 12px;
            text-align: left;
        }
        .demo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .demo-header span {
            font-size: 12px;
            font-weight: 700;
            color: #6b21a8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .demo-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .demo-btn {
            background: #ffffff;
            border: 1px solid #e9d5ff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .demo-btn:hover {
            border-color: #7c3aed;
            background: #f3e8ff;
        }
        .demo-btn strong {
            display: block;
            font-size: 13px;
            color: #1e1b4b;
        }
        .demo-btn small {
            font-size: 11px;
            color: #64748b;
        }
        .demo-btn .badge-click {
            font-size: 11px;
            color: #7c3aed;
            font-weight: 600;
        }
        .footer-nav {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .footer-nav a {
            color: #c4b5fd;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-nav a:hover {
            color: #ffffff;
        }
        .footer-nav .divider {
            color: #6b21a8;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="login-icon">🎪</span><br>
                <span class="login-badge">Organiser Workstation</span>
                <h1 class="login-title" id="page-heading">Event Organiser Sign In</h1>
                <p class="login-subtitle" id="page-subheading">Sign in to schedule events, manage venue limits, and track attendee rosters.</p>
            </div>

            <!-- Auth Mode Toggle Tabs -->
            <div class="auth-toggle">
                <button type="button" class="auth-toggle-btn active" id="btn-toggle-login" onclick="switchAuthMode('login')">
                    <span>🔑</span> Sign In
                </button>
                <button type="button" class="auth-toggle-btn" id="btn-toggle-register" onclick="switchAuthMode('register')">
                    <span>✨</span> Register Organiser
                </button>
            </div>

            <!-- Existing Session Banner -->
            <div id="session-banner" class="alert-box alert-info">
                <div>You are signed in as <strong id="session-name">Organiser</strong>.</div>
                <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <a href="index.html" class="btn btn-primary btn-sm" style="flex:1; text-align:center; background:#7c3aed;">Enter Workstation ➔</a>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="clearExistingSession()">Switch User</button>
                </div>
            </div>

            <!-- Alerts -->
            <div id="error-alert" class="alert-box alert-danger"></div>
            <div id="success-alert" class="alert-box alert-success"></div>

            <!-- FORM 1: Sign In Form -->
            <form id="organiser-login-form" onsubmit="handleOrganiserLogin(event)">
                <div class="form-group">
                    <label for="organiser-email">Organiser Email Address</label>
                    <div class="input-with-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="organiser-email" class="form-control" placeholder="sarah.organiser@eventhub.my" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="organiser-password">Account Password</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="organiser-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btn-login-submit" class="btn-submit">
                    Sign In to Workstation ➔
                </button>
            </form>

            <!-- FORM 2: Register Organiser Form -->
            <form id="organiser-register-form" style="display:none;" onsubmit="handleOrganiserRegister(event)">
                <div class="form-group">
                    <label for="reg-org-name">Organiser / Organization Name</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🏢</span>
                        <input type="text" id="reg-org-name" class="form-control" placeholder="e.g. Cyberjaya Tech Guild" required minlength="3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-org-email">Official Contact Email</label>
                    <div class="input-with-icon">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="reg-org-email" class="form-control" placeholder="e.g. contact@cyberguild.my" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-org-phone">Contact Phone Number (Optional)</label>
                    <div class="input-with-icon">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="reg-org-phone" class="form-control" placeholder="+6013-8889999">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-org-password">Create Password (min. 6 characters)</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-org-password" class="form-control" placeholder="••••••••••••" required minlength="6">
                    </div>
                </div>

                <button type="submit" id="btn-reg-submit" class="btn-submit">
                    Register Organiser &amp; Enter ➔
                </button>
            </form>

            <!-- Quick Demo Credentials Fill (Only shown on Login tab) -->
            <div id="demo-box" class="demo-credentials-box">
                <div class="demo-header">
                    <span>⚡ Quick Demo Credentials</span>
                </div>
                <div class="demo-grid">
                    <button type="button" class="demo-btn" onclick="fillOrganiserCredentials('sarah.organiser@eventhub.my', 'Password123!')">
                        <div>
                            <strong>Sarah Tan (Tech Events)</strong>
                            <small>sarah.organiser@eventhub.my &bull; Password123!</small>
                        </div>
                        <span class="badge-click">Fill &rarr;</span>
                    </button>
                    <button type="button" class="demo-btn" onclick="fillOrganiserCredentials('faizal.organiser@eventhub.my', 'Password123!')">
                        <div>
                            <strong>Ahmad Faizal (Music Guild)</strong>
                            <small>faizal.organiser@eventhub.my &bull; Password123!</small>
                        </div>
                        <span class="badge-click">Fill &rarr;</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="footer-nav">
            <a href="../../index.html">&larr; Back to Master Hub</a>
            <span class="divider">&bull;</span>
            <a href="../admin/login.html">Administrator Sign In &rarr;</a>
        </div>
    </div>

    <script src="../../shared/js/api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = ApiClient.getToken();
            const user = ApiClient.getUser();

            if (token && user && (user.role === 'organiser' || user.role === 'admin')) {
                document.getElementById('session-banner').style.display = 'block';
                document.getElementById('session-name').textContent = user.full_name || 'Organiser';
            }
        });

        function switchAuthMode(mode) {
            hideAlerts();
            const btnLogin = document.getElementById('btn-toggle-login');
            const btnReg = document.getElementById('btn-toggle-register');
            const formLogin = document.getElementById('organiser-login-form');
            const formReg = document.getElementById('organiser-register-form');
            const demoBox = document.getElementById('demo-box');
            const heading = document.getElementById('page-heading');
            const subheading = document.getElementById('page-subheading');

            if (mode === 'register') {
                btnLogin.classList.remove('active');
                btnReg.classList.add('active');
                formLogin.style.display = 'none';
                formReg.style.display = 'block';
                demoBox.style.display = 'none';
                heading.textContent = 'Register New Organiser';
                subheading.textContent = 'Create an event host account to publish schedules, manage venue limits, and track bookings.';
            } else {
                btnReg.classList.remove('active');
                btnLogin.classList.add('active');
                formReg.style.display = 'none';
                formLogin.style.display = 'block';
                demoBox.style.display = 'block';
                heading.textContent = 'Event Organiser Sign In';
                subheading.textContent = 'Sign in to schedule events, manage venue limits, and track attendee rosters.';
            }
        }

        function clearExistingSession() {
            localStorage.removeItem('eventhub_token');
            localStorage.removeItem('eventhub_user');
            document.getElementById('session-banner').style.display = 'none';
        }

        function fillOrganiserCredentials(email, pass) {
            document.getElementById('organiser-email').value = email;
            document.getElementById('organiser-password').value = pass;
            hideAlerts();
        }

        function hideAlerts() {
            document.getElementById('error-alert').style.display = 'none';
            document.getElementById('success-alert').style.display = 'none';
        }

        // LOGIN HANDLER
        async function handleOrganiserLogin(e) {
            e.preventDefault();
            hideAlerts();

            const email = document.getElementById('organiser-email').value.trim();
            const password = document.getElementById('organiser-password').value;
            const btn = document.getElementById('btn-login-submit');

            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Authenticating with REST API...";

            try {
                const res = await ApiClient.post('auth/login', { email, password });

                if (!res.data || !res.data.token) {
                    throw new Error("Invalid response envelope received from server.");
                }

                // Check Role-Based Access Control
                if (res.data.user.role !== 'organiser' && res.data.user.role !== 'admin') {
                    showError(`Access Denied: This account is registered as '${res.data.user.role}'. Only users with 'organiser' (or 'admin') privileges can access this workstation.`);
                    btn.disabled = false;
                    btn.innerHTML = "Sign In to Workstation ➔";
                    return;
                }

                // Store credentials
                ApiClient.setSession(res.data.token, res.data.user);

                const successBox = document.getElementById('success-alert');
                successBox.textContent = `Welcome back, ${res.data.user.full_name}! Redirecting to Organiser Workstation...`;
                successBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);

            } catch (err) {
                console.error("Login failed:", err);
                const msg = err.message || "Invalid email or password combination.";
                showError(msg);
                btn.disabled = false;
                btn.innerHTML = "Sign In to Workstation ➔";
            }
        }

        // REGISTER HANDLER
        async function handleOrganiserRegister(e) {
            e.preventDefault();
            hideAlerts();

            const fullName = document.getElementById('reg-org-name').value.trim();
            const email = document.getElementById('reg-org-email').value.trim();
            const phone = document.getElementById('reg-org-phone').value.trim();
            const password = document.getElementById('reg-org-password').value;
            const btn = document.getElementById('btn-reg-submit');

            if (!fullName || !email || !password) {
                showError("Please fill in all required fields.");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters long.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Registering Organiser...";

            try {
                const payload = {
                    full_name: fullName,
                    email: email,
                    password: password,
                    role: 'organiser',
                    phone_number: phone || null
                };

                const res = await ApiClient.post('auth/register', payload);

                if (!res.data || !res.data.token) {
                    throw new Error("Invalid registration response envelope from server.");
                }

                // Automatically log in newly registered organiser
                ApiClient.setSession(res.data.token, res.data.user);

                const successBox = document.getElementById('success-alert');
                successBox.textContent = `Organiser account created! Welcome, ${res.data.user.full_name}! Redirecting...`;
                successBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);

            } catch (err) {
                console.error("Registration failed:", err);
                const msg = err.message || "Registration failed. This email may already be registered.";
                showError(msg);
                btn.disabled = false;
                btn.innerHTML = "Register Organiser & Enter ➔";
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('error-alert');
            errBox.textContent = msg;
            errBox.style.display = 'block';
        }
    </script>
</body>
</html>
